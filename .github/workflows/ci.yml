name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Pinned: tests run `opencode debug config` against generated output.
      - run: npm install -g opencode-ai@1.19.0
      - run: opencode --version
      - run: npm test
